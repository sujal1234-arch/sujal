<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RaktSetu blood donation dashboard</title>
  <desc id="desc">A practical dashboard showing urgent blood requests, donor availability, and nearby hospitals.</desc>
  <rect width="1200" height="760" fill="#f5f3ef"/>
  <rect x="34" y="34" width="1132" height="692" rx="12" fill="#ffffff" stroke="#d9d8d2"/>
  <rect x="34" y="34" width="225" height="692" rx="12" fill="#222b2c"/>
  <text x="68" y="92" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">RaktSetu</text>
  <text x="68" y="116" fill="#aeb8b4" font-family="Arial,sans-serif" font-size="11">DONATION NETWORK</text>
  <g font-family="Arial,sans-serif" font-size="13">
    <rect x="57" y="170" width="180" height="44" rx="6" fill="#d95b4e"/><text x="80" y="197" fill="#ffffff">Overview</text>
    <text x="80" y="253" fill="#aeb8b4">Urgent requests</text><text x="80" y="305" fill="#aeb8b4">Donors</text><text x="80" y="357" fill="#aeb8b4">Hospitals</text><text x="80" y="409" fill="#aeb8b4">Activity</text>
  </g>
  <circle cx="88" cy="620" r="18" fill="#d7f065"/><text x="81" y="626" fill="#222b2c" font-family="Arial,sans-serif" font-size="14" font-weight="700">S</text><text x="120" y="619" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">Sujal</text><text x="120" y="638" fill="#aeb8b4" font-family="Arial,sans-serif" font-size="10">Administrator</text>
  <g font-family="Arial,sans-serif">
    <text x="300" y="92" fill="#222b2c" font-size="25" font-weight="700">Good morning, Sujal</text><text x="300" y="119" fill="#7d8580" font-size="12">Here is what needs attention today.</text>
    <rect x="300" y="160" width="190" height="112" rx="8" fill="#fff5f2" stroke="#f0d9d4"/><text x="324" y="193" fill="#d95b4e" font-size="12">URGENT REQUESTS</text><text x="324" y="239" fill="#222b2c" font-size="33" font-weight="700">12</text><text x="390" y="239" fill="#7d8580" font-size="11">active now</text>
    <rect x="510" y="160" width="190" height="112" rx="8" fill="#f2f8f2" stroke="#d9ead9"/><text x="534" y="193" fill="#4b8a60" font-size="12">AVAILABLE DONORS</text><text x="534" y="239" fill="#222b2c" font-size="33" font-weight="700">284</text><text x="602" y="239" fill="#7d8580" font-size="11">nearby</text>
    <rect x="720" y="160" width="190" height="112" rx="8" fill="#f5f5fb" stroke="#dedeee"/><text x="744" y="193" fill="#6367a9" font-size="12">MATCHES TODAY</text><text x="744" y="239" fill="#222b2c" font-size="33" font-weight="700">38</text><text x="803" y="239" fill="#7d8580" font-size="11">completed</text>
    <text x="300" y="327" fill="#222b2c" font-size="16" font-weight="700">Urgent requests</text><text x="823" y="327" fill="#d95b4e" font-size="11">View all</text>
    <rect x="300" y="350" width="610" height="74" rx="7" fill="#ffffff" stroke="#e2e1dc"/><circle cx="338" cy="387" r="22" fill="#fff0ed"/><text x="326" y="394" fill="#d95b4e" font-size="13" font-weight="700">O+</text><text x="378" y="378" fill="#222b2c" font-size="13" font-weight="700">City Care Hospital</text><text x="378" y="399" fill="#7d8580" font-size="11">2 units needed · 1.8 km away</text><rect x="796" y="374" width="85" height="25" rx="4" fill="#fff0ed"/><text x="813" y="391" fill="#d95b4e" font-size="10">Critical</text>
    <rect x="300" y="438" width="610" height="74" rx="7" fill="#ffffff" stroke="#e2e1dc"/><circle cx="338" cy="475" r="22" fill="#fff0ed"/><text x="327" y="482" fill="#d95b4e" font-size="13" font-weight="700">B-</text><text x="378" y="466" fill="#222b2c" font-size="13" font-weight="700">St. Mary's Medical</text><text x="378" y="487" fill="#7d8580" font-size="11">1 unit needed · 3.2 km away</text><rect x="796" y="462" width="85" height="25" rx="4" fill="#fff8e5"/><text x="810" y="479" fill="#bd8820" font-size="10">Waiting</text>
    <rect x="940" y="350" width="190" height="162" rx="8" fill="#e9f0e9" stroke="#d6e1d6"/><text x="962" y="380" fill="#222b2c" font-size="13" font-weight="700">Nearby network</text><path d="M960 459l28-34 25 16 25-37 30 28 30-16 21 30v43H960Z" fill="#c8dcc9"/><circle cx="1010" cy="427" r="6" fill="#d95b4e"/><circle cx="1068" cy="405" r="6" fill="#4b8a60"/><circle cx="1090" cy="448" r="6" fill="#d95b4e"/><text x="962" y="491" fill="#7d8580" font-size="10">7 hospitals · 284 donors</text>
  </g>
  <rect x="300" y="568" width="830" height="1" fill="#e2e1dc"/><text x="300" y="606" fill="#7d8580" font-family="Arial,sans-serif" font-size="11">RESPONSE RATE THIS WEEK</text><text x="300" y="653" fill="#222b2c" font-family="Arial,sans-serif" font-size="32" font-weight="700">94.6%</text><path d="M460 644h78l35-28 32 18 40-51 32 24 43-40 42 23 42-35 48 19" fill="none" stroke="#4b8a60" stroke-width="3"/><text x="1016" y="653" fill="#4b8a60" font-family="Arial,sans-serif" font-size="12">+8.2%</text>
</svg>
